name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    name: Physics, chemistry & content tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate content data
        run: python3 tools/datatest/verify_data.py

      - name: Static source checks
        run: python3 tools/import_check.py

      - name: Run simulation test suite
        run: dotnet run --project tools/simtest/SimTest.csproj -c Release

  unity-compile:
    name: Compile check against real Unity assemblies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Скачать Unity reference assemblies
        run: |
          mkdir -p tools/unityref
          curl -sSL -o /tmp/unity.nupkg https://api.nuget.org/v3-flatcontainer/unityengine.modules/2021.3.33/unityengine.modules.2021.3.33.nupkg
          unzip -qo /tmp/unity.nupkg -d /tmp/unity
          chmod -R u+rwX /tmp/unity
          cp /tmp/unity/lib/netstandard2.0/*.dll tools/unityref/
          curl -sSL -o /tmp/ui.nupkg https://api.nuget.org/v3-flatcontainer/unity3d.unityengine.ui/2018.3.5.1/unity3d.unityengine.ui.2018.3.5.1.nupkg
          unzip -qo /tmp/ui.nupkg -d /tmp/ui
          chmod -R u+rwX /tmp/ui
          find /tmp/ui -name 'UnityEngine.UI.dll' -exec cp {} tools/unityref/ \;

      - name: Компиляция геймплейных скриптов
        run: dotnet build tools/compile-check/Elementa.CompileCheck.csproj -p:UnityRefs=$PWD/tools/unityref

      - name: Компиляция геймплея с дефайном Unity 6 (drag / velocity / PhysicMaterial)
        run: |
          python3 - <<'PY'
          src = open("tools/compile-check/Elementa.CompileCheck.csproj").read()
          src = src.replace("<AssemblyName>Assembly-CSharp</AssemblyName>", "<AssemblyName>Assembly-CSharp-Unity6</AssemblyName>")
          src = src.replace('<Compile Include="../../Assets/Scripts/**/*.cs" Exclude="../../Assets/Scripts/Editor/**/*.cs" />',
                            '<Compile Include="../../Assets/Scripts/**/*.cs" Exclude="../../Assets/Scripts/Editor/**/*.cs" />\n    <Compile Include="../unity6-stubs/*.cs" />')
          src = src.replace("UNITY_2021_3_OR_NEWER</DefineConstants>", "UNITY_2021_3_OR_NEWER;UNITY_6000_0_OR_NEWER</DefineConstants>")
          open("tools/compile-check/Unity6.Check.csproj", "w").write(src)
          PY
          dotnet build tools/compile-check/Unity6.Check.csproj -p:UnityRefs=$PWD/tools/unityref

      - name: Компиляция Editor-скриптов с дефайном Unity 6
        run: |
          python3 - <<'PY'
          src = open("tools/compile-check/Elementa.CompileCheck.csproj").read()
          src = src.replace("<AssemblyName>Assembly-CSharp</AssemblyName>", "<AssemblyName>Assembly-CSharp-Editor-Unity6</AssemblyName>")
          src = src.replace('<Compile Include="../../Assets/Scripts/**/*.cs" Exclude="../../Assets/Scripts/Editor/**/*.cs" />',
                            '<Compile Include="../../Assets/Scripts/**/*.cs" />\n    <Compile Include="../editor-stubs/*.cs" />\n    <Compile Include="../unity6-stubs/*.cs" />')
          src = src.replace("<DefineConstants>UNITY_STANDALONE;UNITY_2021_3_OR_NEWER</DefineConstants>",
                            "<DefineConstants>UNITY_STANDALONE;UNITY_EDITOR;UNITY_2021_3_OR_NEWER;UNITY_6000_0_OR_NEWER</DefineConstants>")
          open("tools/compile-check/EditorUnity6.Check.csproj", "w").write(src)
          PY
          dotnet build tools/compile-check/EditorUnity6.Check.csproj -p:UnityRefs=$PWD/tools/unityref

      - name: Компиляция Editor-скриптов
        run: |
          python3 - <<'PY'
          src = open("tools/compile-check/Elementa.CompileCheck.csproj").read()
          src = src.replace("<AssemblyName>Assembly-CSharp</AssemblyName>", "<AssemblyName>Assembly-CSharp-Editor</AssemblyName>")
          src = src.replace('<Compile Include="../../Assets/Scripts/**/*.cs" Exclude="../../Assets/Scripts/Editor/**/*.cs" />',
                            '<Compile Include="../../Assets/Scripts/**/*.cs" />\n    <Compile Include="../editor-stubs/*.cs" />')
          src = src.replace("<DefineConstants>UNITY_STANDALONE;UNITY_2021_3_OR_NEWER</DefineConstants>",
                            "<DefineConstants>UNITY_STANDALONE;UNITY_EDITOR;UNITY_2021_3_OR_NEWER</DefineConstants>")
          open("tools/compile-check/EditorOnly.Check.csproj", "w").write(src)
          PY
          dotnet build tools/compile-check/EditorOnly.Check.csproj -p:UnityRefs=$PWD/tools/unityref
