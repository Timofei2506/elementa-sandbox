name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    name: Physics, chemistry & content tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate content data
        run: python3 tools/datatest/verify_data.py

      - name: Static source checks
        run: python3 tools/import_check.py

      - name: Run simulation test suite
        run: dotnet run --project tools/simtest/SimTest.csproj -c Release
