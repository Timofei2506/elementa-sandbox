name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    name: Simulation core tests (no Unity required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run physics & chemistry test suite
        run: dotnet run --project tools/simtest/SimTest.csproj -c Release
