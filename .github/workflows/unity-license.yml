name: Unity license

# Проверка лицензии Unity для облачной сборки.
#
# ВАЖНО: Unity больше НЕ поддерживает ручную (offline) активацию Personal-лицензий.
# Страница license.unity3d.com/manual теперь отвечает «Offline activation is available
# only for Enterprise and Industry seats», то есть файлы .alf/.ulf для бесплатной
# лицензии получить нельзя, а .ulf, созданный Unity Hub, привязан к машине и в
# облаке отклоняется («Machine bindings don't match»).
#
# Рабочий путь один: попросить место у службы лицензий Unity по логину и паролю
# аккаунта. Это делает Unity licensing client (--activate-all --include-personal),
# который вызывает game-ci CLI. Нужны только UNITY_EMAIL и UNITY_PASSWORD.
#
# Полная инструкция: docs/UNITY_LICENSE_CI.md

on:
  workflow_dispatch: {}

concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  check-license:
    name: Проверить лицензию (email + пароль)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли секреты
        run: |
          missing=""
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing — добавь их: Settings → Secrets and variables → Actions"
            echo "::error::Инструкция: docs/UNITY_LICENSE_CI.md"
            exit 1
          fi
          echo "Логин: $UNITY_EMAIL"
          echo "Длина пароля: ${#UNITY_PASSWORD} символов"

      - name: Установить game-ci CLI
        uses: game-ci/cli@v0.1.76

      - name: Активировать место (personal)
        run: game-ci activate .

      # Место Personal-лицензии остаётся занятым, пока его не вернут,
      # поэтому возвращаем его всегда — иначе закончатся места у аккаунта.
      - name: Вернуть место
        if: always()
        continue-on-error: true
        run: game-ci return-license .
