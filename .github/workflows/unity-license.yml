name: Unity license

# Лицензия Unity для облачной сборки. Файл .alf генерируется официальным образом Unity
# напрямую (старый action game-ci/unity-request-activation-file больше не поддерживается).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        type: choice
        default: request-file
        options:
          - request-file
          - check-license

jobs:
  request-file:
    name: Сгенерировать .alf
    if: github.event.inputs.action == 'request-file'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Образ Unity в tar (docker save)
        run: |
          docker pull unityci/editor:6000.0.85f2-base-3
          docker save unityci/editor:6000.0.85f2-base-3 -o /tmp/unity-image.tar
          ls -lh /tmp/unity-image.tar

      - name: Запросить файл активации
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --entrypoint "" \
            -v "$PWD/out:/artifacts" \
            -v "/tmp/unity-image.tar:/unity-image.tar:ro" \
            unityci/editor:6000.0.85f2-base-3 \
            unity-editor -batchmode -nographics -logFile /dev/stdout \
              -createManualActivationFile -manualLicenseFile /artifacts/Unity_v6000.0.85f2.alf \
            || true
          ls -la out

      - name: Выложить .alf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: out/
          retention-days: 7
          if-no-files-found: warn
